name: 버스 데이터 자동 갱신
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bus-data-update
  cancel-in-progress: false
jobs:
  update-bus-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @wonju-bus/crawl
      - run: pnpm --filter @wonju-bus/crawl test:session
      - name: 시간표 수집·검증·Neon 갱신
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm crawl:publish
